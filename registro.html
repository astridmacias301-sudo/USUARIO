<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Campus Ejercicios de Programación - Registro</title>
</head>
<body>

    <h2>Campus Ejercicios de Programación</h2>
    <h3>Registro de Nuevo Usuario</h3>


    <form action="bienvenida.jsp" method="POST">
        
        <label for="nombre">Nombre Completo:</label><br>
        <input type="text" id="nombre" name="nombre" required><br><br>

        <label for="correo">Correo Electrónico:</label><br>
        <input type="email" id="correo" name="correo" required><br><br>

        <label for="rol">Selecciona tu Rol en la Plataforma:</label><br>
        <select id="rol" name="rol">
            <option value="Aprendiz">Aprendiz</option>
            <option value="Instructor">Instructor</option>
            <option value="Administrador">Administrador</option>
        </select><br><br>

        <label for="nivel">Nivel de Programación Inicial:</label><br>
        <select id="nivel" name="nivel">
            <option value="Básico">Básico</option>
            <option value="Intermedio">Intermedio</option>
            <option value="Avanzado">Avanzado</option>
        </select><br><br>

        <button type="submit">Registrarse e Iniciar</button>
    </form>

</body>
</html>
